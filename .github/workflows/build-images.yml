name: Build and push images

on:
  push:
    branches:
      - production
  workflow_dispatch: {}

env:
  WEBAPP_IMAGE: ghcr.io/naoswilbrink/bigcapital-webapp
  SERVER_IMAGE: ghcr.io/naoswilbrink/bigcapital-server

jobs:
  build-webapp:
    name: Build and push webapp image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./packages/webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEBAPP_IMAGE }}:production
            ${{ env.WEBAPP_IMAGE }}:${{ github.sha }}

  build-server:
    name: Build and push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:production
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
